{% extends 'base.html' %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h2>Confirmar Eliminación</h2>
    </div>
    <div class="card-body">
        <p>¿Estás seguro de que deseas eliminar al colaborador <strong>{{ object }}</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Confirmar Eliminación</button>
            <a href="{% url 'colaborador_list' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}

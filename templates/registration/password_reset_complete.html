{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contraseña Actualizada - SGTR</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        :root {
            --audi-red: #BB0A30;
            --audi-white: #FFFFFF;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-image: url('/static/img/audi_bg_cinematic.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--audi-white);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: -1;
        }

        .success-card {
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            padding: 3rem;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        .btn-primary {
            background: var(--audi-red);
            border: none;
            padding: 0.75rem 2rem;
            font-weight: 600;
            border-radius: 50px;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background: #990826;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="success-card mx-auto">
            <div class="mb-4">
                <i class="bi bi-check-circle-fill" style="font-size: 4rem; color: #4CAF50;"></i>
            </div>
            <h2 class="fw-bold mb-3" style="color: var(--audi-red);">¡Contraseña Actualizada!</h2>
            <p class="text-white-50 mb-4">
                Tu contraseña ha sido cambiada exitosamente.
                <br><br>
                Ya puedes iniciar sesión con tu nueva contraseña.
            </p>
            <a href="{% url 'landing' %}" class="btn btn-primary">
                <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión
            </a>
        </div>
    </div>
</body>

</html>

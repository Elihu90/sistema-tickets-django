{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - SGTR</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        :root {
            --audi-red: #BB0A30;
            --audi-black: #000000;
            --audi-white: #FFFFFF;
            --audi-dark-grey: #1A1A1A;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-image: url('/static/img/audi_bg_cinematic.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--audi-white);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: -1;
        }

        .reset-card {
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            padding: 2.5rem;
            max-width: 500px;
            width: 100%;
        }

        .form-control {
            background-color: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.2);
            color: var(--audi-white);
            border-radius: 10px;
        }

        .form-control:focus {
            background-color: rgba(255, 255, 255, 0.05);
            border-color: var(--audi-red);
            color: var(--audi-white);
            box-shadow: 0 0 0 0.25rem rgba(187, 10, 48, 0.25);
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .btn-primary {
            background: var(--audi-red);
            border: none;
            padding: 0.75rem 2rem;
            font-weight: 600;
            border-radius: 50px;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background: #990826;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 0.75rem 2rem;
            font-weight: 600;
            border-radius: 50px;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            color: white;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="reset-card mx-auto">
            <div class="text-center mb-4">
                <i class="bi bi-key-fill" style="font-size: 3rem; color: var(--audi-red);"></i>
                <h2 class="fw-bold mt-3" style="color: var(--audi-red);">Recuperar Contraseña</h2>
                <p class="text-white-50">Ingresa tu correo electrónico y te enviaremos instrucciones para restablecer tu
                    contraseña.</p>
            </div>

            <form method="post">
                {% csrf_token %}
                <div class="mb-4">
                    <label for="id_email" class="form-label text-white-50">Correo Electrónico</label>
                    <input type="email" class="form-control form-control-lg" id="id_email" name="email"
                        placeholder="tu@email.com" required autofocus>
                </div>

                <button type="submit" class="btn btn-primary w-100 mb-3">
                    <i class="bi bi-envelope-fill me-2"></i>Enviar Instrucciones
                </button>

                <a href="{% url 'landing' %}" class="btn btn-secondary w-100">
                    <i class="bi bi-arrow-left me-2"></i>Volver al Inicio
                </a>
            </form>
        </div>
    </div>
</body>

</html>
